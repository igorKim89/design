<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#edeff4"><meta name="robots" content="noindex,nofollow">
<title>Persona</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{--bg:#edeff4;--hi:#ffffff;--lo:rgba(158,170,194,.55);--ink:#3b3224;--mute:#8d8a94;--orange:#fea831;--round:"Outfit","Avenir Next","Segoe UI",system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
 --e:44px;--raise:-9px -9px 20px var(--hi),10px 10px 24px var(--lo);--raise-s:-5px -5px 11px var(--hi),6px 6px 14px var(--lo);--inset:inset -5px -5px 10px var(--hi),inset 6px 6px 12px var(--lo)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);font-family:var(--round);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.page{position:relative;min-height:calc(var(--vh,1vh)*100);min-height:100dvh;display:grid;grid-template-rows:1fr}
.stage{position:relative;min-height:0}
/* countdown, top left */
.cd{position:absolute;z-index:5;left:var(--e);top:calc(22px + env(safe-area-inset-top,0px));padding:clamp(14px,1.5vw,22px) clamp(16px,1.7vw,26px) clamp(16px,1.6vw,24px);border-radius:30px;background:var(--bg);box-shadow:var(--raise)}
.cd .k{display:flex;align-items:center;gap:10px;margin:0 0 clamp(10px,1.1vw,16px);font-size:clamp(11px,.9vw,13px);font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.cd .k::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(254,168,49,.18);animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 7px rgba(254,168,49,.06)}}
.cells{display:flex;gap:clamp(8px,.9vw,14px)}
.cell{width:clamp(54px,5.3vw,78px);padding:clamp(10px,1.1vw,15px) 0 clamp(8px,.9vw,12px);border-radius:20px;background:var(--bg);box-shadow:var(--inset);text-align:center}
.cell b{display:block;font-size:clamp(24px,2.55vw,38px);line-height:1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--orange)}
.cell span{display:block;margin-top:clamp(5px,.5vw,8px);font-size:clamp(9px,.75vw,11.5px);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.beta{margin:clamp(10px,1.1vw,16px) 0 0;font-size:clamp(11px,.9vw,13px);color:var(--mute);font-weight:400}
/* logo, centre */
.mid{--fs:clamp(17px,2.35vw,46px);position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(32px - var(--fs)*.15);pointer-events:none}
.logo{position:relative;z-index:3;flex:none;width:min(34vw,600px);margin:0}
.logo img{display:block;width:100%;height:auto;filter:drop-shadow(-4px -4px 6px rgba(255,255,255,.95)) drop-shadow(7px 8px 9px rgba(180,110,20,.28)) drop-shadow(14px 16px 22px rgba(158,170,194,.45));animation:lg 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes lg{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(10px)}}
/* characters, right */
.duo{position:absolute;z-index:2;right:var(--e);bottom:clamp(10px,2.5vh,28px);height:min(70vh,860px);aspect-ratio:1.04/1.35;display:flex;align-items:flex-end;justify-content:center}
.disc{position:absolute;left:4%;right:4%;bottom:4%;aspect-ratio:1;border-radius:50%;background:var(--bg);box-shadow:var(--raise)}
.disc::after{content:"";position:absolute;inset:11%;border-radius:50%;box-shadow:var(--inset)}
.who{position:relative;height:88%;display:block;will-change:transform;filter:drop-shadow(10px 14px 14px rgba(120,130,155,.35))}
.who img{display:block;height:100%;width:auto}
.who.b{margin-right:-5%;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) .25s both,fl 6s ease-in-out 1.4s infinite}
.who.g{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) .45s both,fl 6s ease-in-out 2.2s infinite}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
@keyframes fl{50%{transform:translateY(-8px)}}
.copy{position:absolute;z-index:4;left:50%;bottom:clamp(6px,1.4vh,14px);transform:translateX(-50%);font-size:12px;color:var(--mute);letter-spacing:.03em;white-space:nowrap}
/* running line under the logo (same format as on the About page) */
.lm{position:relative;z-index:1;flex:none;width:100vw;height:calc(var(--fs)*1.2);display:flex;align-items:center;overflow:hidden;pointer-events:none;animation:lg 1.4s cubic-bezier(.2,.8,.2,1) .25s both}
.tr{display:flex;width:max-content;animation:mq 60s linear infinite}
.seg{flex:none;white-space:nowrap;font-weight:600;font-size:var(--fs);line-height:1;color:var(--orange);padding-right:.7em;letter-spacing:-.01em}
@keyframes mq{from{transform:none}to{transform:translateX(-50%)}}
/* side menu, bottom left (same look as on the case pages) */
.side{position:fixed;z-index:15;left:var(--e);bottom:30px;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.side div{display:flex;align-items:center;gap:8px;padding:1px 0;cursor:default;user-select:none;-webkit-user-select:none;font-size:13px;color:#9a9578;transition:color .2s,transform .3s cubic-bezier(.3,1.5,.5,1);animation:sd .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.5s + var(--n)*70ms)}
.side div::before{content:"";width:8px;height:8px;border-radius:50%;background:#fed9a6;transition:background .2s,transform .3s cubic-bezier(.3,1.7,.5,1)}
.side div:hover{color:#000;transform:translateX(4px)}.side div:hover::before{background:var(--orange);transform:scale(1.25)}
.side div.cur{color:#000;font-weight:500}.side div.cur::before{background:var(--orange)}
@keyframes sd{from{opacity:0;transform:translateX(-14px)}}
/* top-right menu: same pill as on the other pages, only the language choice inside */
.nav{position:fixed;z-index:70;top:calc(22px + env(safe-area-inset-top,0px));right:var(--e);width:56px;height:56px;border-radius:28px;background:var(--orange);overflow:hidden;color:#fff;transition:width .5s cubic-bezier(.7,0,.2,1),height .5s cubic-bezier(.7,0,.2,1)}
.nav.open{width:212px}
.tog{position:absolute;z-index:2;top:0;right:0;width:56px;height:56px;border:0;background:none;cursor:pointer;color:#fff}
.dots,.x{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .25s,transform .4s}
.dots i{display:block;width:5px;height:5px;border-radius:50%;background:#fff;margin:2px 0}
.x{opacity:0;transform:rotate(-90deg);font-size:0}
.x::before,.x::after{content:"";position:absolute;left:18px;top:27px;width:20px;height:2.5px;background:#fff;border-radius:2px;transform:rotate(45deg)}
.x::after{transform:rotate(-45deg)}
.nav.open .dots{opacity:0;transform:rotate(90deg)}.nav.open .x{opacity:1;transform:none}
.list{width:212px;padding:18px 20px 22px 40px;pointer-events:none;opacity:0;transition:opacity .2s}
.nav.open .list{pointer-events:auto;opacity:1;transition:opacity .35s .25s}
.lg-btn{display:flex;align-items:center;gap:10px;margin:0;padding:0;background:none;border:0;color:#fff;font:500 15px/1.3 var(--round);cursor:pointer}
.lg-btn:hover span{text-decoration:underline}
.lg-ico{position:relative;display:block;width:36px;height:36px;flex:none;filter:drop-shadow(0 2px 3px rgba(150,70,0,.25))}
.lg-ico.globe{animation:wob 5s ease-in-out infinite}.lg-ico.pop{animation:lpop .7s cubic-bezier(.3,1.5,.5,1)}
.lg-row{display:flex;gap:8px;margin-left:-24px;height:0;overflow:hidden;pointer-events:none}
.lg-row.open{height:48px;overflow:visible;pointer-events:auto}
.lc{display:block;width:38px;height:38px;padding:0;margin-top:10px;border:0;background:none;border-radius:50%;cursor:pointer;transform:scale(.3);opacity:0;transition:transform .4s cubic-bezier(.3,1.7,.5,1),opacity .25s;transition-delay:calc(var(--n)*55ms)}
.lg-row.open .lc{transform:none;opacity:1}
.lc:hover{transform:translateY(-3px) scale(1.08);transition-delay:0s}
.lc.sel{box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 0 6px rgba(255,255,255,.35)}
.bst{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;pointer-events:none}
@keyframes wob{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-12deg)}93%{transform:rotate(10deg)}97%{transform:rotate(-4deg)}}
@keyframes lpop{0%{transform:scale(.2) rotate(-200deg);opacity:0}60%{transform:scale(1.18) rotate(12deg);opacity:1}100%{transform:none;opacity:1}}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.nav :focus-visible{outline-color:#fff}
@media (max-width:560px){.nav{top:calc(14px + env(safe-area-inset-top,0px))}.nav.open{width:min(212px,calc(100vw - 28px))}}
/* tablet / phone: stacked */
@media (max-width:820px){:root{--e:24px}}
@media (max-width:560px){:root{--e:14px}}
@media (max-width:980px){
 .stage{display:flex;flex-direction:column;align-items:center;padding:calc(14px + 56px + 14px + env(safe-area-inset-top,0px)) var(--e) 8px;gap:clamp(14px,3vh,28px)}
 .cd,.duo{position:relative;left:auto;right:auto;top:auto;bottom:auto;transform:none}
 .cd{align-self:stretch;margin:0}
 .cells{justify-content:space-between}.cell{flex:1;width:auto}
 .mid{position:relative;inset:auto;width:100vw;margin:clamp(6px,2vh,24px) calc(var(--e)*-1) 0;--fs:clamp(15px,4.5vw,28px)}
 .logo{width:min(86vw,520px)}
 .duo{height:clamp(250px,43vh,560px);width:min(86vw,560px);flex:none;aspect-ratio:auto}
 .who{height:100%}
 .disc{height:90%;width:auto}
 .disc{left:50%;right:auto;transform:translateX(-50%);bottom:0}
}
 @media (max-width:980px){
 .side{position:relative;left:auto;bottom:auto;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:4px 18px;max-width:92vw}
 .copy{position:relative;left:auto;bottom:auto;transform:none;white-space:normal;text-align:center;padding:2px 0 calc(10px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:980px) and (orientation:landscape){.stage{display:block}.cd{position:relative}}
@media (prefers-reduced-motion:reduce){.tr,.who,.logo img,.cd .k::before{animation:none!important}}
</style></head>
<body>
<div class="page">
 <nav class="nav" id="nav" aria-label="Menu">
 <button class="tog" id="tog" aria-expanded="false" aria-controls="list" aria-label="Open menu"><span class="dots"><span><i></i><i></i><i></i></span></span><span class="x"></span></button>
 <div class="list" id="list"><button class="lg-btn" id="lgBtn" aria-expanded="false" aria-controls="lgRow"><span class="lg-ico globe" id="lgIco"></span><span>Language</span></button><div class="lg-row" id="lgRow"></div></div>
</nav>
 <main class="stage">
  <section class="cd" aria-label="Time left until the Beta launch">
   <p class="k">Beta launch in</p>
   <div class="cells" role="timer" aria-live="off">
    <div class="cell"><b id="cM">00</b><span id="lM">months</span></div>
    <div class="cell"><b id="cD">00</b><span id="lD">days</span></div>
    <div class="cell"><b id="cH">00</b><span id="lH">hours</span></div>
    <div class="cell"><b id="cN">00</b><span id="lN">minutes</span></div>
    <div class="cell"><b id="cS">00</b><span id="lS">seconds</span></div>
   </div>
   <p class="beta">Beta 1.0.1</p>
  </section>
  <div class="mid"><h1 class="logo"><img src="persona-logo.png" alt="Persona" width="1600" height="317"></h1>
   <div class="lm" role="marquee" aria-label="Why click 100 times when you can just say ONE thing? No endless menus. No complicated shortcuts. No unnecessary clicking."><div class="tr" id="tr"></div></div></div>
  <div class="duo" aria-hidden="true">
   <div class="disc"></div>
   <div class="who b"><img src="persona-boy.png" alt="" width="442" height="1250"></div>
   <div class="who g"><img src="persona-girl.png" alt="" width="447" height="1250"></div>
  </div>
  <nav class="side" aria-label="Menu"><div class="cur" style="--n:0">Home</div><div style="--n:1">News</div><div style="--n:2">About Persona</div><div style="--n:3">Download App</div><div style="--n:4">Subscription</div><div style="--n:5">Contacts</div></nav>
  <div class="copy">©2026 Persona. All Right Reserved. Beta 1.0.1</div>
 </main>
</div>
<script>
(function(){
 /* marquee: two identical halves => seamless loop */
 var t='Why click 100 times when you can just say ONE thing? No endless menus. No complicated shortcuts. No unnecessary clicking. ✨ ',one='',i;for(i=0;i<2;i++)one+='<span class="seg">'+t+'</span>';
 document.getElementById('tr').innerHTML=one+one;
 /* countdown to the Beta launch: 1 Jan 2027, 02:06:51 Moscow time (= 1 month 24 days 10:51:51 from the brief) */
 var T=new Date('2027-01-01T02:06:51+03:00').getTime(),E=function(id){return document.getElementById(id)};
 function pl(n,a){return n===1?a[0]:a[1]}
 function addM(d,n){var x=new Date(d.getTime()),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);var last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x}
 function z(n){return n<10?'0'+n:''+n}
 function tick(){
  var now=new Date(),left=T-now.getTime();if(left<0)left=0,now=new Date(T);
  var mo=0;while(addM(now,mo+1).getTime()<=T&&mo<60)mo++;
  var r=T-addM(now,mo).getTime();if(r<0)r=0;
  var d=Math.floor(r/864e5);r-=d*864e5;var h=Math.floor(r/36e5);r-=h*36e5;var mi=Math.floor(r/6e4);r-=mi*6e4;var s=Math.floor(r/1e3);
  E('cM').textContent=z(mo);E('cD').textContent=z(d);E('cH').textContent=z(h);E('cN').textContent=z(mi);E('cS').textContent=z(s);
  E('lM').textContent=pl(mo,['month','months']);E('lD').textContent=pl(d,['day','days']);E('lH').textContent=pl(h,['hour','hours']);E('lN').textContent=pl(mi,['minute','minutes']);E('lS').textContent=pl(s,['second','seconds']);
 }
 tick();setInterval(tick,250);
 
 /* language menu (same icons and behaviour as on the other pages; the choice is remembered site-wide) */
 var nav=document.getElementById('nav'),tog=document.getElementById('tog'),list=document.getElementById('list'),row=document.getElementById('lgRow'),ico=document.getElementById('lgIco'),VALID=['en','ru','de','ko'],LG='en';
 try{LG=new URLSearchParams(location.search).get('lang')}catch(e){}
 if(VALID.indexOf(LG)<0){try{LG=localStorage.getItem('lang')}catch(e){LG=null}}
 if(VALID.indexOf(LG)<0)LG=null;
 let uid=0;
 const star=(cx,cy,r,rot=0)=>{const p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2+rot,R=i%2?r*.4:r;p.push((cx+R*Math.cos(a)).toFixed(1)+','+(cy+R*Math.sin(a)).toFixed(1))}return '<polygon points="'+p.join(' ')+'"/>'};
 const badge=inner=>{const id='cp'+(uid++);return '<svg viewBox="0 0 36 36" width="100%" height="100%"><defs><clipPath id="'+id+'"><circle cx="18" cy="18" r="16"/></clipPath></defs><g clip-path="url(#'+id+')">'+inner+'<ellipse cx="12" cy="9" rx="9" ry="5" fill="#fff" opacity=".22"/></g><circle cx="18" cy="18" r="16" fill="none" stroke="#fff" stroke-width="2.5"/></svg>'};
 const tri=(cx,cy,r)=>'<g transform="rotate('+r+' '+cx+' '+cy+')" fill="#222"><rect x="'+(cx-4)+'" y="'+(cy-3)+'" width="8" height="1.4"/><rect x="'+(cx-4)+'" y="'+(cy-.7)+'" width="8" height="1.4"/><rect x="'+(cx-4)+'" y="'+(cy+1.6)+'" width="8" height="1.4"/></g>';
 const FLAG={
  ru:()=>badge('<rect width="36" height="12" fill="#fff"/><rect y="12" width="36" height="12" fill="#3a68d4"/><rect y="24" width="36" height="12" fill="#e0413a"/>'),
  de:()=>badge('<rect width="36" height="12" fill="#33302b"/><rect y="12" width="36" height="12" fill="#e0413a"/><rect y="24" width="36" height="12" fill="#ffc928"/>'),
  en:()=>badge('<rect width="36" height="36" fill="#2f4aa8"/><path d="M0 0L36 36M36 0L0 36" stroke="#fff" stroke-width="7"/><path d="M0 0L36 36M36 0L0 36" stroke="#e0413a" stroke-width="3"/><path d="M18 0V36M0 18H36" stroke="#fff" stroke-width="10"/><path d="M18 0V36M0 18H36" stroke="#e0413a" stroke-width="6"/>'),
  ko:()=>badge('<rect width="36" height="36" fill="#fff"/><circle cx="18" cy="18" r="7" fill="#0047a0"/><path d="M11 18a7 7 0 0 1 14 0z" fill="#cd2e3a"/><circle cx="14.5" cy="18" r="3.5" fill="#cd2e3a"/><circle cx="21.5" cy="18" r="3.5" fill="#0047a0"/>'+tri(7,7,-45)+tri(29,7,45)+tri(7,29,45)+tri(29,29,-45))
 };
 const GLOBE='<svg viewBox="0 0 36 36" width="100%" height="100%"><circle cx="18" cy="18" r="16" fill="#fff"/><circle cx="18" cy="19" r="11.5" fill="#fea831"/><ellipse cx="18" cy="19" rx="5" ry="11.5" fill="none" stroke="#fff" stroke-width="1.5" opacity=".35"/><circle cx="14" cy="17" r="1.6" fill="#3b3224"/><circle cx="22" cy="17" r="1.6" fill="#3b3224"/><path d="M15 21.2q3 2.6 6 0" fill="none" stroke="#3b3224" stroke-width="1.6" stroke-linecap="round"/><circle cx="11.2" cy="20.6" r="1.7" fill="#ff7b6b" opacity=".6"/><circle cx="24.8" cy="20.6" r="1.7" fill="#ff7b6b" opacity=".6"/><path class="sp" d="M30 3l1.1 2.9L34 7l-2.9 1.1L30 11l-1.1-2.9L26 7l2.9-1.1z" fill="#ffc83d"/></svg>';
 const NAMES={ru:'Русский',en:'English',de:'Deutsch',ko:'한국어'};
 row.innerHTML=['ru','en','de','ko'].map((l,n)=>'<button class="lc" data-l="'+l+'" style="--n:'+n+'" aria-label="'+NAMES[l]+'" title="'+NAMES[l]+'">'+FLAG[l]()+'</button>').join('');
 function burst(el){const c=['#fff','#ffe27a','#ffd0a0'];for(let k=0;k<7;k++){const d=document.createElement('i');d.className='bst';d.style.background=c[k%3];el.appendChild(d);const a=k/7*Math.PI*2,r=24+Math.random()*10;
  d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*r+'px,'+Math.sin(a)*r+'px) scale(.2)',opacity:0}],{duration:650,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>d.remove()}}
 function setIcon(l,anim){ico.innerHTML=l?FLAG[l]():GLOBE;ico.classList.toggle('globe',!l);
  row.querySelectorAll('.lc').forEach(b=>b.classList.toggle('sel',b.dataset.l===l));
  if(anim){ico.classList.remove('pop');void ico.offsetWidth;ico.classList.add('pop');burst(ico)}}
 
 
 function menuH(){list.style.height='auto';var h=list.offsetHeight;list.style.height='';return h}
 function setMenu(o){nav.classList.toggle('open',o);tog.setAttribute('aria-expanded',o);tog.setAttribute('aria-label',o?'Close menu':'Open menu');nav.style.height=o?menuH()+'px':'56px';if(!o)row.classList.remove('open')}
 function toggleRow(o){var open=o===undefined?!row.classList.contains('open'):o;row.classList.toggle('open',open);document.getElementById('lgBtn').setAttribute('aria-expanded',open);if(nav.classList.contains('open'))nav.style.height=menuH()+'px'}
 function setLang(l){LG=l;try{localStorage.setItem('lang',l)}catch(e){}try{sessionStorage.setItem('lang',l)}catch(e){}window.name='lang='+l;setIcon(l,true);setTimeout(function(){toggleRow(false)},650)}
 tog.addEventListener('click',function(){setMenu(!nav.classList.contains('open'))});
 document.addEventListener('click',function(e){if(e.target.closest('#lgBtn')){toggleRow();return}var lc=e.target.closest('[data-l]');if(lc){setLang(lc.dataset.l);return}if(nav.classList.contains('open')&&!e.target.closest('#nav'))setMenu(false)});
 addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false)});
 setIcon(LG,false);
 /* mobile browser bars */
 function vh(){document.documentElement.style.setProperty('--vh',((window.visualViewport&&visualViewport.height)||innerHeight)*0.01+'px')}vh();addEventListener('resize',vh);
})();
</script></body></html>

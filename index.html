<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#fea831">
<title>Igor Prakopchyk — Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--sw:max(100vw,calc(var(--vh)*1248/704));--orange:#fea831;--round:"Outfit","Avenir Next","Segoe UI",system-ui,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
*{box-sizing:border-box}html,body{background:var(--orange);font-family:var(--round);color:#fff}
button{font:inherit;color:inherit}a{color:inherit}:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* the scene clips the oversized GIF, so the page itself never grows wider than the screen */
.scene{position:fixed;inset:0;overflow:hidden;z-index:0}
.stage{position:absolute;left:50%;top:50%;width:var(--sw);aspect-ratio:1248/704;transform:translate(-50%,-50%)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hot{position:absolute;inset:0;cursor:none;z-index:5;touch-action:manipulation;clip-path:polygon(41.83% 43.32%,43.91% 37.22%,46.88% 33.81%,50.08% 34.09%,53.69% 36.65%,56.49% 41.19%,58.25% 49.01%,58.17% 56.82%,57.05% 61.36%,58.89% 66.76%,60.10% 73.86%,59.94% 80.26%,59.13% 86.65%,56.09% 90.91%,49.68% 92.61%,43.27% 91.19%,39.90% 85.94%,39.10% 77.41%,40.06% 70.31%,42.87% 65.62%,42.63% 61.08%,41.51% 54.69%,41.27% 48.30%)}

/* "Hey!" circle, only while the cursor is over the character (on touch: pops up above the finger) */
.hi{position:fixed;left:0;top:0;z-index:20;--d:max(92px,calc(var(--sw)*.095));width:var(--d);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--d)/-2);border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:600;font-size:calc(var(--d)*.25);letter-spacing:-.01em;pointer-events:none;transform:translate3d(-300px,-300px,0);opacity:0;scale:.9;transition:opacity .35s ease,scale .35s ease}
.hi.on{opacity:1;scale:1}

/* tap hint for touch screens: soft pulse over the character until the first tap */
.tap{display:none;position:absolute;left:49.6%;top:46%;width:0;height:0;z-index:4;pointer-events:none;opacity:0;animation:tapIn .7s ease 5.7s forwards}
.tap i{position:absolute;left:0;top:0;--td:calc(var(--sw)*.05);width:var(--td);height:var(--td);margin:calc(var(--td)/-2);border-radius:50%;border:2.5px solid #fff;opacity:0;animation:tapRing 2.6s ease-out infinite}
.tap i:nth-child(2){animation-delay:.85s}
.tap b{position:absolute;left:0;top:0;width:calc(var(--sw)*.016);height:calc(var(--sw)*.016);margin:calc(var(--sw)*-.008);border-radius:50%;background:#fff;box-shadow:0 0 0 calc(var(--sw)*.006) rgba(254,168,49,.8),0 4px 14px rgba(60,30,0,.35);animation:tapDot 2.6s ease-in-out infinite}
.tap.gone{animation:tapOut .35s ease forwards}
@keyframes tapIn{to{opacity:1}}
@keyframes tapOut{from{opacity:1}to{opacity:0}}
@keyframes tapRing{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes tapDot{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media (hover:none) and (pointer:coarse){.tap{display:block}.hi{--d:clamp(84px,calc(var(--sw)*.095),116px);transition:opacity .25s ease,scale .5s cubic-bezier(.3,1.7,.5,1)}}

/* top-left labels on orange highlight */
.brand{position:fixed;z-index:15;left:calc(clamp(16px,2.4vw,44px) + var(--sl));top:calc(clamp(16px,2vw,24px) + var(--st));pointer-events:none}
.brand span{display:block;line-height:1.35;font-weight:400;font-size:clamp(13px,.95vw,16px);letter-spacing:.02em;text-shadow:0 1px 12px rgba(60,30,0,.6)}
.brand span.t{font-weight:500;font-size:clamp(22px,1.9vw,32px);margin-bottom:10px;line-height:1.1;letter-spacing:0}

.shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(120deg,rgba(60,30,0,.4),transparent 36%)}
/* bottom-left greeting */
.card{position:fixed;left:calc(clamp(14px,2.4vw,36px) + var(--sl));bottom:calc(clamp(14px,2.4vw,32px) + var(--sb));z-index:10;max-width:min(88vw,310px);padding:14px 16px 15px;border-radius:20px;background:rgba(43,26,5,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(255,255,255,.2);animation:rise .95s cubic-bezier(.2,.9,.3,1.12) 4.7s both}
@keyframes rise{from{transform:translateY(calc(100% + 60px));opacity:0}to{transform:none;opacity:1}}
.card h1{margin:0;font-weight:500;font-size:clamp(20px,2.1vw,28px);letter-spacing:-.01em;line-height:1.1}
.card p{margin:5px 0 11px;font-size:clamp(12.5px,1vw,14.5px);font-weight:400;line-height:1.35;color:#fff3df}
.links{display:flex;gap:6px;flex-wrap:wrap}.links a{background:var(--orange);color:#fff;text-decoration:none;font-weight:500;font-size:12.5px;padding:6px 13px;border-radius:99px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.links a.g{background:rgba(255,255,255,.2)}
@media (hover:hover){.links a:hover{transform:translateY(-2px)}}
.links a:active{transform:scale(.94)}

/* ============ ADAPTIVE ============ */
/* portrait (phones and tablets): the character stays centred, the greeting becomes a full-width bottom panel */
@media (max-aspect-ratio:1/1){
 .shade{background:linear-gradient(180deg,rgba(60,30,0,.5),transparent 26%),linear-gradient(0deg,rgba(43,26,5,.5),transparent 34%)}
 .card{left:calc(14px + var(--sl));right:calc(14px + var(--sr));bottom:calc(14px + var(--sb));max-width:none;padding:16px 18px 18px;border-radius:24px}
 .card h1{font-size:26px}
 .card p{font-size:14.5px;margin:6px 0 14px}
 .links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 .links a{display:grid;place-items:center;min-height:44px;font-size:14px;padding:0 6px;text-align:center}
}
/* tablets in portrait: bigger type, card keeps a tidy width */
@media (min-width:600px) and (max-aspect-ratio:1/1){
 .brand{left:calc(28px + var(--sl));top:calc(24px + var(--st))}
 .brand span.t{font-size:30px;margin-bottom:12px}
 .brand span{font-size:16px}
 .card{right:auto;width:min(460px,calc(100vw - 56px));left:calc(28px + var(--sl));bottom:calc(28px + var(--sb));padding:20px 22px 22px;border-radius:28px}
 .card h1{font-size:32px}
 .card p{font-size:16.5px;margin:7px 0 16px}
 .links a{min-height:48px;font-size:15.5px}
}
/* small phones */
@media (max-width:380px) and (max-aspect-ratio:1/1){
 .card{padding:14px 15px 15px}.card h1{font-size:23px}.card p{font-size:13.5px;margin:5px 0 12px}.links a{min-height:42px;font-size:13px}
}
/* landscape phones: everything shrinks to leave the character clear */
@media (max-height:520px) and (min-aspect-ratio:1/1){
 .brand{top:calc(10px + var(--st))}
 .brand span.t{font-size:19px;margin-bottom:6px}
 .brand span{font-size:12px;line-height:1.3}
 .card{left:calc(14px + var(--sl));bottom:calc(10px + var(--sb));max-width:min(300px,calc(40vw - 14px - var(--sl)));padding:10px 14px 12px;border-radius:18px}
 .card h1{font-size:19px}
 .card p{font-size:12px;margin:3px 0 8px}
 .links a{font-size:12px;padding:0 12px;min-height:34px;display:grid;place-items:center}
}
@media (prefers-reduced-motion:reduce){.tap,.tap i,.tap b{animation:none}.tap{opacity:1}.tap i{opacity:.6}}
</style><link rel="stylesheet" href="common.css"></head><body data-page="home">

 <svg class="ring" viewBox="-30 -30 360 360"><defs><path id="c" d="M150,150 m-140,0 a140,140 0 1,1 280,0 a140,140 0 1,1 -280,0"/></defs>
 <text><textPath id="rt" href="#c" textLength="868" lengthAdjust="spacing">Welcome to my room. Click me! Welcome to my room. Click me!</textPath></text></svg><div class="inside"><small data-i="ld_s">Don’t be shy.<br>Feel free to say</small><b data-i="ld_b">“Hey!”</b></div></div>
<script>
const $=id=>document.getElementById(id),hot=$('hot'),hi=$('hi'),tap=$('tap');
/* "Hey!" follows the cursor only over the character; on touch it pops up above the finger */
let x=0,y=0,tx=0,ty=0,raf=0,hideT;
function loop(){x+=(tx-x)*.22;y+=(ty-y)*.22;hi.style.transform=`translate3d(${x}px,${y}px,0)`;raf=requestAnimationFrame(loop)}
function show(e){
 const touch=e.pointerType==='touch',d=hi.offsetWidth||100;
 tx=e.clientX;ty=e.clientY;
 if(touch){ty=e.clientY-d*.85;tx=Math.min(Math.max(tx,d/2+8),innerWidth-d/2-8);if(ty<d/2+8)ty=e.clientY+d*.85}
 if(!hi.classList.contains('on')){x=tx;y=ty;hi.style.transform=`translate3d(${x}px,${y}px,0)`}
 hi.classList.add('on');if(!raf)loop();
 if(touch){clearTimeout(hideT);hideT=setTimeout(()=>hi.classList.remove('on'),1500);dismissHint()}
}
function dismissHint(){if(tap&&!tap.classList.contains('gone')){tap.classList.add('gone');tap.addEventListener('animationend',()=>tap.remove(),{once:true})}}
hot.addEventListener('pointerenter',show);hot.addEventListener('pointermove',show);hot.addEventListener('pointerdown',show);
hot.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')hi.classList.remove('on')});
</script><script src="app.js"></script>

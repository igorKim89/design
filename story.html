<style>
html{--vh:1vh;-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--padr:max(var(--pad),160px);--orange:#fea831;--ink:#3b3224;--bgc:#f8f7f3;--mut:#8d8a6c;--round:"Outfit","Avenir Next","Segoe UI",system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;--pad:clamp(20px,5vw,84px);--ease:cubic-bezier(.2,.8,.2,1)}

html.scroll body{height:auto;max-height:none;position:static;overflow:visible;contain:none;margin:0;background:var(--bgc);font-family:var(--round);color:var(--ink);touch-action:auto}

.side{position:fixed;z-index:15;right:clamp(16px,2.2vw,40px);bottom:clamp(16px,2.4vw,30px);display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.side button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:1px 0;cursor:pointer;font-size:13px;color:#9a9578;transition:color .2s}
.side button::after{content:"";width:8px;height:8px;border-radius:50%;background:#fed9a6;transition:background .2s}
.side button:hover{color:#000}.side button:hover::after{background:var(--orange)}
.side button.cur{color:#000;font-weight:500}.side button.cur::after{background:var(--orange)}
.bar{position:fixed;left:0;top:0;height:3px;width:100%;background:var(--orange);transform:scaleX(0);transform-origin:0 50%;z-index:60;pointer-events:none}

/* ---------- reveal helpers ---------- */
.rv .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.16em;margin-bottom:-.16em}
.rv .w>i{display:inline-block;font-style:normal;transform:translateY(112%) rotate(4deg);transform-origin:0 100%;transition:transform 1s var(--ease);transition-delay:calc(var(--n)*70ms + var(--d,0ms))}
.rv.in .w>i{transform:none}
.fade{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s var(--ease);transition-delay:var(--d,0ms)}
.fade.in{opacity:1;transform:none}
mark{background:linear-gradient(transparent 56%,rgba(254,168,49,.5) 56%) no-repeat 0 0/0% 100%;color:inherit;padding:0 .08em;margin:0 -.08em;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size 1.2s var(--ease) .55s}
.in mark,mark.in{background-size:100% 100%}

/* ---------- intro: chaotic photos appear and vanish one after another ---------- */
.stage{position:relative;height:calc(var(--vh,1vh)*100);min-height:520px;overflow:hidden}
.ph{--k:1;position:absolute;left:min(var(--l),calc(100% - var(--w)*var(--k)*1vw - 3%));top:min(var(--t),calc(100% - var(--w)*var(--k)*1vw*var(--ar) - 6%));width:calc(var(--w)*var(--k)*1vw);aspect-ratio:1/var(--ar);rotate:var(--r);border-radius:var(--br,14px);overflow:hidden;opacity:0;box-shadow:0 30px 60px -28px rgba(70,45,10,.45);will-change:transform,opacity,clip-path}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.18);animation:kb 3.4s ease-out both;animation-delay:inherit;animation-play-state:inherit}
@keyframes kb{to{transform:scale(1)}}
body.go .ph{animation:pin 2.5s var(--ease) both;animation-delay:calc(var(--i)*.45s + .1s)}
@keyframes pin{
 0%{opacity:0;clip-path:inset(100% 0 0 0);scale:.9;translate:0 34px}
 14%{opacity:1;clip-path:inset(0 0 0 0);scale:1;translate:0 0}
 78%{opacity:1;clip-path:inset(0 0 0 0);scale:1.01;translate:0 -8px;filter:blur(0)}
 100%{opacity:0;clip-path:inset(0 0 100% 0);scale:1.05;translate:0 -26px;filter:blur(5px)}}
.cap{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 var(--pad);pointer-events:none}
.cap h1{margin:0;font-weight:600;letter-spacing:-.035em;line-height:.98;font-size:clamp(40px,8vw,140px)}

.scrollcue{position:absolute;left:50%;bottom:clamp(22px,5vh,48px);translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);opacity:0;transition:opacity 1s ease 0s}

body.done .scrollcue{opacity:1}

/* ---------- chapters ---------- */
.chap{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(30px,6vw,120px);padding:clamp(70px,14vh,170px) var(--padr) clamp(30px,6vh,80px) var(--pad)}

.txt{max-width:40em}

.txt a.lnk:hover{background-size:100% 100%;color:#fff}
.quote{position:relative;margin:clamp(26px,5vh,56px) 0 clamp(26px,5vh,56px) 0;padding-left:clamp(22px,2.4vw,38px);border-left:3px solid var(--orange)}
.quote q{display:block;quotes:none;font-weight:600;letter-spacing:-.025em;line-height:1.14;font-size:clamp(24px,2.9vw,48px)}
.quote.big{border:0;padding:0;margin-top:clamp(40px,7vh,80px)}
.quote.big q::before,.quote.big q::after{color:var(--orange);font-weight:700;font-size:1.25em;line-height:0;display:inline-block;vertical-align:-.16em}
.quote.big q::before{content:"“";margin-right:.08em}
.quote.big q::after{content:"”";margin-left:.04em}
.sig{margin-top:clamp(56px,10vh,110px);font-weight:600;letter-spacing:-.03em;line-height:1.05;font-size:clamp(28px,4.2vw,72px)}
.sig small{display:block;margin-top:.7em;font-size:max(.34em,15px);letter-spacing:0;font-weight:400;color:var(--mut)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,28px);margin:clamp(30px,6vh,56px) 0 clamp(36px,7vh,64px)}
.stat{padding:clamp(16px,1.8vw,26px);border-radius:22px;background:#fff;box-shadow:0 20px 40px -30px rgba(70,45,10,.4);transition:transform .5s var(--ease),background .4s}
.stat:hover{transform:translateY(-6px);background:#fff4e2}
.stat b{display:block;font-weight:700;font-size:clamp(34px,4vw,68px);line-height:1;letter-spacing:-.03em;color:var(--orange)}
.stat span{display:block;margin-top:.5em;font-size:clamp(13px,1vw,16px);line-height:1.35;color:#5a5240}

/* cta */
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:clamp(26px,4vh,40px) 0 clamp(36px,6vh,64px)}
.pill{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--ink);background:none;border-radius:99px;padding:14px 26px;font-weight:500;font-size:clamp(15px,1.1vw,18px);cursor:pointer;text-decoration:none;transition:background .3s,color .3s,border-color .3s,transform .4s var(--ease)}
.pill:hover{background:var(--orange);border-color:var(--orange);color:#fff;transform:translateY(-3px)}
.pill.solid{background:var(--orange);border-color:var(--orange);color:#fff}
.pill.solid:hover{background:var(--ink);border-color:var(--ink)}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:clamp(60px,12vh,140px) var(--padr) 36px var(--pad);font-size:13px;color:var(--mut)}
.foot a{text-decoration:none}.foot a:hover{color:var(--ink)}

@media (max-width:900px){
 :root{--padr:var(--pad)}
 .ph{--k:2.1}
 .chap{grid-template-columns:1fr;gap:26px}
 .sticky{position:relative;top:auto;display:grid;grid-template-columns:1fr minmax(0,150px);gap:14px 20px;align-items:end}
 .num{grid-column:1/2}.chap h2{grid-column:1/2;margin-top:0}
 .snap{grid-column:2/3;grid-row:1/3;margin:0;width:100%}
 .stats{grid-template-columns:1fr}
 .side{display:none}
}
@media (max-width:520px){.ph{--k:2.5}}
@media (prefers-reduced-motion:reduce){body.go .ph{animation-name:pinsoft}}
@keyframes pinsoft{0%{opacity:0}14%{opacity:1}78%{opacity:1}100%{opacity:0}}

<script>
(function(){
const D={
en:{
 title:'My story',sub:'The long version',scroll:'Scroll',back:'← Back to About',
 ch:[
 {t:'How it all began',img:1,b:[
  ['lede','Sometimes, to find your place in life, you first have to dare to go the wrong way.'],
  ['p','In **2016** I worked in an **auto parts warehouse**. A stable job, a decent salary, good colleagues and friends. Everything seemed fine. But every day I caught myself thinking that I was living somehow wrong. As if I were taking **someone else’s place in my own life**.'],
  ['p','I had always liked creating something beautiful. Something that stirs emotion, catches the eye, is useful and stays in memory. I didn’t want to work just for a paycheck. I wanted to do something that truly mattered to me. To leave a mark. A small one, but my own.'],
  ['p','And then I remembered that as a kid I had tried to **build websites**. I was curious, I experimented and came up with things of my own. But I was very young and never saw it as a possible future. I remember my dad once asked me:'],
  ['q','“Are you going to make money from this? Is this going to be your life?”'],
  ['p','In the end I dropped the hobby.'],
  ['p','Years passed, and I came back to that thought.'],
  ['p','I started watching **YouTube tutorials**, studying design and trying myself in a completely new field. I had no clear plan, no guarantees, no certainty it would work out. Only a feeling that I was finally moving in the right direction.'],
  ['p','But it wasn’t only about design.'],
  ['p','Once I visited **Thailand**. That trip changed my idea of what life can be. Different places, people, culture, atmosphere: everything felt incredibly alive and interesting. And above all, I felt that inner calm that is hard to put into words.'],
  ['p','I wanted to go back. But not as a tourist who eventually flies home. As a person who can choose where to live and what to do.'],
  ['p','So I set a goal: master a profession that would let me **work remotely**, and one day buy a one-way ticket.'],
  ['p','I didn’t know how long it would take. But the decision had already been made.']]},
 {t:'A one-way ticket',img:3,b:[
  ['p','Leaving the warehouse wasn’t easy. I was leaving not a bad job but a perfectly good, stable life. There were people I talked to every day, a familiar rhythm and a clear future.'],
  ['p','But sometimes the hardest part is admitting to yourself that the familiar no longer makes you happy.'],
  ['p','I left and started learning. Day by day, month by month. I figured out the tools, studied interfaces, looked for my own approach, made mistakes and tried again. Little by little an interest in building websites turned into a profession, and a dream into a concrete goal that I came closer to with every new project.'],
  ['p','It didn’t happen in a few weeks. It took me about **three years** to go from the first lessons to the moment I could make my dream real.'],
  ['p','And then one day I bought a **one-way ticket** and flew to Thailand.'],
  ['p','No return ticket. Without full certainty about what was waiting. But knowing that I had brought myself to that point.'],
  ['q','For some people it’s just a move to another country. For me it was proof that life really can change if you stop putting it off.']]},
 {t:'Ten years later',img:7,b:[
  ['p','Ten years have passed since 2016.'],
  ['stats',[['2016','Where it started'],['10','Years in design'],['500+','Projects, and maybe already 700']]],
  ['p','In that time design became much more than a profession. I grew, gained huge experience and worked on hundreds of projects: **more than 500, and maybe already 700**. I built interfaces, looked for solutions to complex problems, experimented, learned from others and kept discovering something new.'],
  ['p','Some of my work can be seen on <a class="lnk" href="https://dribbble.com/kimmmy" target="_blank" rel="noopener">Dribbble</a>.'],
  ['p','But I never saw my path as a story about how many projects I managed to do or what heights I reached. What matters far more to me is that I’m still interested. That after all these years I can still get excited about an idea, light up for a new project and want to make something better than yesterday.'],
  ['p','I keep growing, trying new things and moving forward. Because good design to me is not just beautiful screens. It’s **emotion, logic, attention to detail** and solutions that truly help people.'],
  ['p','And yet for a long time I lacked one thing: a website of my own.'],
  ['p','A place that would be entirely mine. Where I could gather my work, show my approach, share my thoughts and tell a little about the person on the other side of the interfaces.'],
  ['p','And so I finally decided to create it.']]},
 {t:'What’s next?',img:5,b:[
  ['p','You know, sometimes I think about that guy who in 2016 worked in a warehouse and simply felt he wanted something different.'],
  ['p','He didn’t yet know who he would become. He couldn’t imagine how many projects were waiting for him, what he would have to learn and where the decision to change everything would one day lead him.'],
  ['p','But he tried anyway.'],
  ['p','And that, I think, is the most important thing in my whole story. Not that everything turned out perfectly. Not that every step was right. But that I **didn’t stay in place** just because it was more familiar and comfortable.'],
  ['p','This site is not the end of my path. It’s just **another chapter**.'],
  ['p','I still want to make interesting things, meet people whose eyes light up, work on projects I believe in, and one day look back and think: “Damn, I’m glad I finally dared.”'],
  ['p','If my approach resonates with you, if you have an interesting idea, a project, or simply want to get to know me, write to me. I’m open to conversation, new connections and collaboration.'],
  ['p','And if you’re standing on the edge of change yourself and don’t know whether to try something new, maybe my story will remind you of one simple thing.'],
  ['bq','You don’t have to know the whole route. Sometimes it’s enough to realise you no longer want to stay where you are.'],
  ['sig','Thank you for reading to the end.','See you in the next chapter.']]}
 ]},
ru:{
 title:'Моя история',sub:'Подробная версия',scroll:'Листай',back:'← Назад к «Обо мне»',
 ch:[
 {t:'С чего всё начиналось',img:1,b:[
  ['lede','Иногда, чтобы найти своё место в жизни, нужно сначала решиться уйти не туда.'],
  ['p','В **2016 году** я работал на **складе автозапчастей**. У меня была стабильная работа, неплохая зарплата, хорошие коллеги и друзья. Всё вроде бы было нормально. Но каждый день я ловил себя на мысли, что живу как-то не так. Будто занимаю **чужое место в собственной жизни**.'],
  ['p','Мне всегда нравилось создавать что-то красивое. Что-то, что вызывает эмоции, цепляет взгляд, приносит пользу и остаётся в памяти. Мне хотелось не просто работать ради зарплаты, а делать то, что действительно имеет для меня значение. Оставить свой след. Пусть небольшой, но свой.'],
  ['p','И однажды я вспомнил, что ещё в детстве пытался **создавать сайты**. Мне было интересно разбираться в этом, экспериментировать, придумывать что-то своё. Но тогда я был совсем маленьким и не воспринимал это как возможное будущее. Помню, папа однажды спросил меня:'],
  ['q','«Ты что, будешь этим зарабатывать? Это будет твоей жизнью?»'],
  ['p','В итоге я забросил своё увлечение.'],
  ['p','Прошли годы, и я снова вернулся к этой мысли.'],
  ['p','Я начал смотреть **уроки на YouTube**, изучать дизайн и пробовать себя в совершенно новой сфере. У меня не было чёткого плана, гарантий или уверенности, что всё получится. Было только ощущение, что я наконец-то двигаюсь в правильном направлении.'],
  ['p','Но дело было не только в дизайне.'],
  ['p','Однажды я побывал в **Таиланде**. Эта поездка изменила моё представление о том, какой может быть жизнь. Другие места, люди, культура, атмосфера — всё казалось невероятно живым и интересным. А главное, я почувствовал то самое внутреннее спокойствие, которое сложно объяснить словами.'],
  ['p','Мне захотелось вернуться. Но уже не в качестве туриста, который однажды уедет домой, а человека, который может сам выбирать, где ему жить и чем заниматься.'],
  ['p','Тогда я поставил перед собой цель: освоить профессию, которая позволит мне **работать удалённо**, и однажды купить билет в один конец.'],
  ['p','Я ещё не знал, сколько времени это займёт. Но решение уже было принято.']]},
 {t:'Билет в один конец',img:3,b:[
  ['p','Уйти со склада было непросто. Я оставлял не плохую работу, а вполне хорошую и стабильную жизнь. Там были люди, с которыми я общался каждый день, привычный ритм и понятное будущее.'],
  ['p','Но иногда самое сложное — признаться самому себе, что привычное больше не делает тебя счастливым.'],
  ['p','Я ушёл и начал учиться. День за днём, месяц за месяцем. Разбирался в инструментах, изучал интерфейсы, искал свой подход, ошибался и пробовал снова. Постепенно интерес к созданию сайтов превратился в профессию, а мечта — в конкретную цель, к которой я приближался с каждым новым проектом.'],
  ['p','Это не случилось за несколько недель. Мне понадобилось около **трёх лет**, чтобы пройти путь от первых уроков до момента, когда я смог осуществить свою мечту.'],
  ['p','И вот однажды я купил **билет в один конец** и улетел в Таиланд.'],
  ['p','Без обратного билета. Без полной уверенности в том, что ждёт впереди. Зато с пониманием, что я сам привёл себя в эту точку.'],
  ['q','Для кого-то это просто переезд в другую страну. Для меня — доказательство того, что жизнь действительно может измениться, если перестать откладывать её на потом.']]},
 {t:'Десять лет спустя',img:7,b:[
  ['p','С 2016 года прошло десять лет.'],
  ['stats',[['2016','С чего всё началось'],['10','лет в дизайне'],['500+','проектов, а возможно, уже 700']]],
  ['p','За это время дизайн стал гораздо большим, чем просто профессией. Я вырос, получил огромный опыт и поработал над сотнями проектов — **более 500, а возможно, уже и 700**. Я создавал интерфейсы, искал решения для сложных задач, экспериментировал, учился у других и постоянно открывал для себя что-то новое.'],
  ['p','Часть моих работ можно посмотреть на <a class="lnk" href="https://dribbble.com/kimmmy" target="_blank" rel="noopener">Dribbble</a>.'],
  ['p','Но я никогда не воспринимал свой путь как историю о том, сколько проектов удалось сделать или каких высот получилось достичь. Для меня гораздо важнее то, что мне до сих пор интересно. Что спустя столько лет я всё ещё могу увлечься идеей, загореться новым проектом и захотеть сделать что-то лучше, чем вчера.'],
  ['p','Я продолжаю развиваться, пробовать новое и двигаться дальше. Потому что хороший дизайн для меня — это не просто красивые экраны. Это **эмоции, логика, внимание к деталям** и решения, которые действительно помогают людям.'],
  ['p','И всё же долгое время у меня не было одной вещи — собственного сайта.'],
  ['p','Места, которое было бы полностью моим. Где я мог бы собрать свои работы, показать свой подход, поделиться мыслями и рассказать немного о человеке по ту сторону интерфейсов.'],
  ['p','И вот я наконец решил его создать.']]},
 {t:'А что дальше?',img:5,b:[
  ['p','Знаешь, иногда я думаю о том парне, который в 2016 году работал на складе и просто чувствовал, что хочет чего-то другого.'],
  ['p','Он ещё не знал, кем станет. Не представлял, сколько проектов его ждёт, чему ему предстоит научиться и куда однажды приведёт его решение всё изменить.'],
  ['p','Но он всё-таки попробовал.'],
  ['p','И, пожалуй, именно это я считаю самым важным во всей своей истории. Не то, что всё получилось идеально. Не то, что каждый шаг был правильным. А то, что я **не остался на месте** только потому, что так было привычнее и спокойнее.'],
  ['p','Этот сайт — не итог моего пути. Это просто **ещё одна его глава**.'],
  ['p','Мне по-прежнему хочется создавать интересные вещи, встречать людей, у которых горят глаза, работать над проектами, в которые веришь, и однажды оглянуться назад с мыслью: «Чёрт, как же здорово, что тогда я всё-таки решился».'],
  ['p','Если тебе близок мой подход, если у тебя есть интересная идея, проект или просто желание познакомиться — напиши мне. Я открыт к общению, новым знакомствам и сотрудничеству.'],
  ['p','А если ты сейчас сам стоишь на пороге перемен и не знаешь, стоит ли пробовать что-то новое, то, возможно, моя история напомнит тебе об одной простой вещи.'],
  ['bq','Необязательно знать весь маршрут. Иногда достаточно понять, что ты больше не хочешь оставаться там, где находишься.'],
  ['sig','Спасибо, что дочитал до конца.','Увидимся в следующей главе.']]}
 ]},
de:{
 title:'Meine Geschichte',sub:'Die lange Version',scroll:'Scrollen',back:'← Zurück zu „Über mich“',
 ch:[
 {t:'Wie alles begann',img:1,b:[
  ['lede','Manchmal muss man sich erst trauen, den falschen Weg zu gehen, um seinen Platz im Leben zu finden.'],
  ['p','Im Jahr **2016** arbeitete ich in einem **Autoteile-Lager**. Ein stabiler Job, ein ordentliches Gehalt, nette Kollegen und Freunde. Eigentlich war alles in Ordnung. Aber jeden Tag ertappte ich mich bei dem Gedanken, dass ich irgendwie falsch lebe. Als würde ich **einen fremden Platz in meinem eigenen Leben** einnehmen.'],
  ['p','Ich habe schon immer gern etwas Schönes geschaffen. Etwas, das Emotionen weckt, den Blick fängt, nützlich ist und in Erinnerung bleibt. Ich wollte nicht nur für ein Gehalt arbeiten, sondern etwas tun, das mir wirklich etwas bedeutet. Eine Spur hinterlassen. Eine kleine, aber meine eigene.'],
  ['p','Und eines Tages fiel mir ein, dass ich schon als Kind versucht hatte, **Websites zu bauen**. Es hat mich interessiert, ich habe experimentiert und mir eigene Dinge ausgedacht. Aber ich war damals noch sehr klein und sah darin keine mögliche Zukunft. Ich erinnere mich, dass mein Vater mich einmal fragte:'],
  ['q','„Willst du damit etwa Geld verdienen? Soll das dein Leben werden?“'],
  ['p','Am Ende ließ ich mein Hobby fallen.'],
  ['p','Jahre vergingen, und ich kam auf diesen Gedanken zurück.'],
  ['p','Ich begann, **YouTube-Tutorials** zu schauen, Design zu lernen und mich in einem völlig neuen Bereich auszuprobieren. Ich hatte keinen klaren Plan, keine Garantien und keine Gewissheit, dass es klappen würde. Nur das Gefühl, endlich in die richtige Richtung zu gehen.'],
  ['p','Aber es ging nicht nur ums Design.'],
  ['p','Einmal reiste ich nach **Thailand**. Diese Reise veränderte meine Vorstellung davon, wie das Leben sein kann. Andere Orte, Menschen, Kultur, Atmosphäre: alles wirkte unglaublich lebendig und interessant. Und vor allem spürte ich diese innere Ruhe, die sich kaum in Worte fassen lässt.'],
  ['p','Ich wollte zurück. Aber nicht als Tourist, der irgendwann wieder nach Hause fliegt, sondern als jemand, der selbst wählen kann, wo er lebt und was er tut.'],
  ['p','Also setzte ich mir ein Ziel: einen Beruf zu meistern, mit dem ich **remote arbeiten** kann, und eines Tages ein One-Way-Ticket zu kaufen.'],
  ['p','Ich wusste noch nicht, wie lange das dauern würde. Aber die Entscheidung war gefallen.']]},
 {t:'One-Way-Ticket',img:3,b:[
  ['p','Das Lager zu verlassen war nicht leicht. Ich ließ keinen schlechten Job zurück, sondern ein ganz gutes, stabiles Leben. Da waren Menschen, mit denen ich jeden Tag sprach, ein vertrauter Rhythmus und eine klare Zukunft.'],
  ['p','Aber manchmal ist das Schwerste, sich selbst einzugestehen, dass das Vertraute einen nicht mehr glücklich macht.'],
  ['p','Ich ging und fing an zu lernen. Tag für Tag, Monat für Monat. Ich lernte Tools kennen, studierte Interfaces, suchte meinen eigenen Ansatz, machte Fehler und versuchte es erneut. Nach und nach wurde aus dem Interesse am Websitebauen ein Beruf und aus dem Traum ein konkretes Ziel, dem ich mit jedem neuen Projekt näher kam.'],
  ['p','Das geschah nicht in ein paar Wochen. Ich brauchte etwa **drei Jahre** vom ersten Tutorial bis zu dem Moment, in dem ich meinen Traum verwirklichen konnte.'],
  ['p','Und dann kaufte ich eines Tages ein **One-Way-Ticket** und flog nach Thailand.'],
  ['p','Ohne Rückflug. Ohne völlige Gewissheit, was mich erwartet. Aber mit dem Wissen, dass ich mich selbst an diesen Punkt gebracht hatte.'],
  ['q','Für manche ist es nur ein Umzug in ein anderes Land. Für mich war es der Beweis, dass sich das Leben wirklich ändern kann, wenn man aufhört, es aufzuschieben.']]},
 {t:'Zehn Jahre später',img:7,b:[
  ['p','Seit 2016 sind zehn Jahre vergangen.'],
  ['stats',[['2016','Wo alles begann'],['10','Jahre im Design'],['500+','Projekte, vielleicht schon 700']]],
  ['p','In dieser Zeit wurde Design viel mehr als ein Beruf. Ich bin gewachsen, habe riesige Erfahrung gesammelt und an Hunderten Projekten gearbeitet: **mehr als 500, vielleicht schon 700**. Ich habe Interfaces gebaut, Lösungen für komplexe Aufgaben gesucht, experimentiert, von anderen gelernt und ständig Neues entdeckt.'],
  ['p','Einen Teil meiner Arbeiten kannst du auf <a class="lnk" href="https://dribbble.com/kimmmy" target="_blank" rel="noopener">Dribbble</a> ansehen.'],
  ['p','Aber ich habe meinen Weg nie als Geschichte darüber gesehen, wie viele Projekte ich geschafft oder welche Höhen ich erreicht habe. Viel wichtiger ist mir, dass ich immer noch neugierig bin. Dass ich mich nach so vielen Jahren noch für eine Idee begeistern, für ein neues Projekt brennen und etwas besser machen will als gestern.'],
  ['p','Ich entwickle mich weiter, probiere Neues aus und gehe voran. Denn gutes Design ist für mich nicht nur schöne Screens. Es sind **Emotionen, Logik, Liebe zum Detail** und Lösungen, die Menschen wirklich helfen.'],
  ['p','Und doch fehlte mir lange eine Sache: eine eigene Website.'],
  ['p','Ein Ort, der ganz mir gehört. Wo ich meine Arbeiten sammeln, meinen Ansatz zeigen, Gedanken teilen und ein wenig über den Menschen hinter den Interfaces erzählen kann.'],
  ['p','Und so habe ich mich endlich entschlossen, sie zu erschaffen.']]},
 {t:'Und was kommt jetzt?',img:5,b:[
  ['p','Weißt du, manchmal denke ich an den Typen, der 2016 im Lager arbeitete und einfach spürte, dass er etwas anderes wollte.'],
  ['p','Er wusste noch nicht, wer er werden würde. Er ahnte nicht, wie viele Projekte auf ihn warteten, was er lernen musste und wohin ihn die Entscheidung, alles zu ändern, einmal führen würde.'],
  ['p','Aber er hat es trotzdem versucht.'],
  ['p','Und das ist wohl das Wichtigste in meiner ganzen Geschichte. Nicht, dass alles perfekt geklappt hat. Nicht, dass jeder Schritt richtig war. Sondern dass ich **nicht stehen geblieben bin**, nur weil es vertrauter und bequemer war.'],
  ['p','Diese Website ist nicht das Ende meines Weges. Sie ist nur **ein weiteres Kapitel**.'],
  ['p','Ich möchte weiter interessante Dinge erschaffen, Menschen treffen, deren Augen leuchten, an Projekten arbeiten, an die ich glaube, und eines Tages zurückblicken und denken: „Verdammt, bin ich froh, dass ich mich damals getraut habe.“'],
  ['p','Wenn dir mein Ansatz gefällt, wenn du eine spannende Idee, ein Projekt oder einfach Lust hast, mich kennenzulernen: Schreib mir. Ich bin offen für Gespräche, neue Bekanntschaften und Zusammenarbeit.'],
  ['p','Und wenn du selbst gerade an der Schwelle zur Veränderung stehst und nicht weißt, ob du etwas Neues wagen sollst, erinnert dich meine Geschichte vielleicht an eine einfache Sache.'],
  ['bq','Man muss nicht die ganze Route kennen. Manchmal reicht es zu verstehen, dass man nicht länger dort bleiben will, wo man ist.'],
  ['sig','Danke, dass du bis zum Ende gelesen hast.','Wir sehen uns im nächsten Kapitel.']]}
 ]},
ko:{
 title:'나의 이야기',sub:'긴 버전',scroll:'스크롤',back:'← 소개로 돌아가기',
 ch:[
 {t:'모든 것의 시작',img:1,b:[
  ['lede','때로는 내 자리를 찾기 위해 먼저 잘못된 길로 가 볼 용기가 필요합니다.'],
  ['p','**2016년**, 저는 **자동차 부품 창고**에서 일했습니다. 안정적인 직장, 괜찮은 월급, 좋은 동료와 친구들이 있었죠. 겉으로는 모든 게 괜찮았습니다. 하지만 매일 어딘가 잘못 살고 있다는 생각이 들었습니다. 마치 **내 삶에서 남의 자리를 차지하고 있는 것** 같았어요.'],
  ['p','저는 늘 아름다운 것을 만드는 걸 좋아했습니다. 감정을 불러일으키고, 시선을 사로잡고, 쓸모가 있으며 기억에 남는 무언가를요. 월급을 위해서만 일하고 싶지 않았습니다. 정말 의미 있는 일을 하고 싶었습니다. 작더라도 나만의 흔적을 남기고 싶었어요.'],
  ['p','그러다 문득, 어릴 때 **웹사이트를 만들어 보려 했던** 기억이 떠올랐습니다. 알아가는 게 재미있었고, 실험하고, 나만의 것을 생각해 냈죠. 하지만 그땐 너무 어렸고 그것이 미래가 될 수 있다고는 생각하지 못했습니다. 아버지가 한번 이렇게 물으셨던 게 기억납니다.'],
  ['q','“그걸로 돈을 벌겠다고? 그게 네 인생이 될 거라고?”'],
  ['p','결국 저는 그 취미를 접었습니다.'],
  ['p','세월이 흘렀고, 저는 다시 그 생각으로 돌아왔습니다.'],
  ['p','**유튜브 강의**를 보며 디자인을 공부하고, 완전히 새로운 분야에 도전하기 시작했습니다. 뚜렷한 계획도, 보장도, 잘될 거라는 확신도 없었습니다. 다만 드디어 올바른 방향으로 가고 있다는 느낌만 있었죠.'],
  ['p','하지만 디자인만의 문제는 아니었습니다.'],
  ['p','한번은 **태국**에 다녀왔습니다. 그 여행은 삶이 어떤 모습일 수 있는지에 대한 제 생각을 바꿔 놓았습니다. 다른 장소, 사람, 문화, 분위기가 모두 놀랍도록 생생하고 흥미로웠어요. 무엇보다 말로 설명하기 어려운 내면의 평온을 느꼈습니다.'],
  ['p','다시 돌아가고 싶었습니다. 하지만 언젠가 집으로 돌아가는 여행자가 아니라, 어디서 살고 무엇을 할지 스스로 고를 수 있는 사람으로요.'],
  ['p','그래서 목표를 세웠습니다. **원격으로 일할 수 있는** 직업을 익히고, 언젠가 편도 티켓을 끊겠다고.'],
  ['p','시간이 얼마나 걸릴지는 아직 몰랐습니다. 하지만 결심은 이미 섰습니다.']]},
 {t:'편도 티켓',img:3,b:[
  ['p','창고를 떠나는 건 쉽지 않았습니다. 나쁜 직장이 아니라 꽤 괜찮고 안정적인 삶을 두고 떠나는 것이었으니까요. 매일 얘기하던 사람들, 익숙한 리듬, 분명한 미래가 있었습니다.'],
  ['p','하지만 때로는 익숙한 것이 더 이상 나를 행복하게 하지 않는다는 걸 스스로 인정하는 게 가장 어렵습니다.'],
  ['p','저는 떠나서 배우기 시작했습니다. 하루하루, 한 달 한 달. 도구를 익히고, 인터페이스를 공부하고, 나만의 방식을 찾고, 실수하고 다시 도전했습니다. 웹사이트 만들기에 대한 관심은 조금씩 직업이 되었고, 꿈은 새 프로젝트를 할 때마다 가까워지는 구체적인 목표가 되었습니다.'],
  ['p','몇 주 만에 이뤄진 일이 아닙니다. 첫 강의에서 꿈을 이룰 수 있는 순간까지 약 **3년**이 걸렸습니다.'],
  ['p','그리고 어느 날, 저는 **편도 티켓**을 끊고 태국으로 날아갔습니다.'],
  ['p','돌아오는 표 없이. 앞으로 무엇이 기다리는지 완전히 확신하지 못한 채. 하지만 제 힘으로 이 자리에 왔다는 걸 알고 있었습니다.'],
  ['q','누군가에게는 그저 다른 나라로의 이사입니다. 저에게는 미루기를 멈추면 삶이 정말 바뀔 수 있다는 증거였습니다.']]},
 {t:'10년 후',img:7,b:[
  ['p','2016년 이후 10년이 흘렀습니다.'],
  ['stats',[['2016','시작'],['10','디자인 경력(년)'],['500+','프로젝트, 어쩌면 벌써 700개']]],
  ['p','그 시간 동안 디자인은 단순한 직업 이상이 되었습니다. 저는 성장했고, 엄청난 경험을 쌓았으며, 수백 개의 프로젝트를 했습니다. **500개가 넘고, 어쩌면 벌써 700개**일 겁니다. 인터페이스를 만들고, 복잡한 문제의 해법을 찾고, 실험하고, 다른 사람에게 배우며 끊임없이 새로운 것을 발견했습니다.'],
  ['p','제 작업 일부는 <a class="lnk" href="https://dribbble.com/kimmmy" target="_blank" rel="noopener">Dribbble</a>에서 볼 수 있습니다.'],
  ['p','하지만 저는 제 길을 얼마나 많은 프로젝트를 했는지, 어떤 높이에 올랐는지에 대한 이야기로 여긴 적이 없습니다. 훨씬 중요한 건 지금도 여전히 흥미롭다는 것입니다. 이렇게 시간이 지났는데도 아이디어에 빠지고, 새 프로젝트에 불타오르고, 어제보다 더 잘 만들고 싶어진다는 것이요.'],

const $=id=>document.getElementById(id);
const mk=s=>s.replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>');
let io=null,cnt=null;
function split(el){let n=0;(function walk(node){[...node.childNodes].forEach(c=>{
 if(c.nodeType===3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(' '));return}
  const w=document.createElement('span');w.className='w';const i=document.createElement('i');i.textContent=p;i.style.setProperty('--n',n++);w.appendChild(i);f.appendChild(w)});c.replaceWith(f)}
 else if(c.nodeType===1)walk(c)})})(el)}
function render(){
 const L=D[document.documentElement.lang]?document.documentElement.lang:'en',d=D[L];
 const t0=$('t0');t0.textContent=d.title;t0.classList.remove('in');split(t0);
 $('t0s').textContent=d.sub;$('sc').textContent=d.scroll;$('back').textContent=d.back;
 const box=$('chapters');box.innerHTML='';
 d.ch.forEach((c,k)=>{
  const sec=document.createElement('section');sec.className='chap';
  let h='<div class="side-l"><div class="sticky"><span class="num fade">0'+(k+1)+'</span><h2 class="rv">'+c.t+'</h2><div class="snap fade" style="--r:'+(k%2?3:-4)+'deg;--d:150ms"><img src="p'+c.img+'.jpg" alt="" loading="lazy"></div></div></div><div class="txt">';
  c.b.forEach(b=>{
   if(b[0]==='p')h+='<p class="fade">'+mk(b[1])+'</p>';
   else if(b[0]==='lede')h+='<p class="lede fade">'+mk(b[1])+'</p>';
   else if(b[0]==='q')h+='<div class="quote fade"><q class="rv">'+b[1]+'</q></div>';
   else if(b[0]==='bq')h+='<div class="quote big fade"><q class="rv">'+b[1]+'</q></div>';
   else if(b[0]==='stats')h+='<div class="stats">'+b[1].map((s,i)=>'<div class="stat fade" style="--d:'+i*120+'ms"><b data-c="'+s[0]+'">'+s[0]+'</b><span>'+s[1]+'</span></div>').join('')+'</div>';

 box.querySelectorAll('.rv').forEach(split);

function observe(root){
 if(io)io.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;el.classList.add('in');io.unobserve(el);
  if(el.classList.contains('stat'))count(el.querySelector('b'))}),{threshold:.2,rootMargin:'0px 0px -8% 0px'});
 root.querySelectorAll('.rv,.fade').forEach(el=>io.observe(el));
}
function count(b){const raw=b.dataset.c,m=raw.match(/^(\d+)(.*)$/);if(!m)return;const to=+m[1],suf=m[2];if(to<20){return}
 const t0=performance.now(),dur=1400;(function f(n){const p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,3);b.textContent=Math.round(to*e)+suf;if(p<1)requestAnimationFrame(f)})(t0)}

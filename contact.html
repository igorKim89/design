<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#f5f6ef">
<title>Contact — Kim Product Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--orange:#fea831;--ink:#3b3224;--bgc:#f5f6ef;--round:"Outfit","Avenir Next","Segoe UI",system-ui,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;--sh:max(var(--vh),calc(100vw*704/1248))}
*{box-sizing:border-box}html,body{background:var(--bgc);font-family:var(--round);color:var(--ink)}
button{font:inherit;color:inherit}a{color:inherit}:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.stage{position:fixed;inset:0;overflow:hidden}
.stage img{position:absolute;left:50%;top:50%;width:max(100vw,calc(var(--vh)*1248/704));aspect-ratio:1248/704;transform:translate(-50%,-50%) scale(1.05);display:block;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.brand{position:fixed;z-index:15;left:calc(clamp(16px,2.4vw,44px) + var(--sl));top:calc(clamp(16px,2vw,24px) + var(--st));line-height:1.35}
.brand a{display:block;text-decoration:none;font-weight:500;font-size:clamp(22px,1.9vw,32px);line-height:1.1;letter-spacing:0;margin-bottom:10px}
.brand span{display:block;font-weight:400;font-size:clamp(13px,.95vw,16px);letter-spacing:.02em}

.hero{position:fixed;left:0;right:0;z-index:12;top:calc(var(--vh)/2 - var(--sh)/2 + var(--sh)*.135);transform:translateY(-50%);text-align:center;padding:0 16px;pointer-events:none}
.hero h1{margin:0;display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.28em;font-weight:500;font-size:clamp(32px,4.4vw,64px);letter-spacing:-.02em;line-height:1.1}
.hero .w{display:inline-block;white-space:pre}
.ch{display:inline-block;opacity:0;transform:translateY(70%);animation:chr .8s cubic-bezier(.2,.9,.3,1.25) forwards;animation-delay:calc(var(--base,4.7s) + var(--i)*55ms)}
@keyframes chr{to{opacity:1;transform:none}}
.arrow{position:relative;pointer-events:auto;display:inline-grid;place-items:center;width:.62em;height:.62em;border:0;background:none;padding:0;cursor:pointer;opacity:0;transform:scale(.3) rotate(-40deg);animation:pop .7s cubic-bezier(.3,1.7,.5,1) var(--abase,5.45s) forwards}
.arrow::after{content:"";position:absolute;inset:-14px}  /* bigger invisible tap area */
@keyframes pop{to{opacity:1;transform:none}}
.arrow svg{width:100%;height:100%;overflow:visible;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
@media (hover:hover){.arrow:hover svg{transform:translate(4px,-4px) scale(1.1)}}
.arrow:active svg{transform:scale(.85)}
.hero p{margin:8px 0 0;font-weight:400;font-size:clamp(15px,1.5vw,22px);opacity:0;transform:translateY(12px);animation:fu .8s ease-out 5.2s forwards}
@keyframes fu{to{opacity:1;transform:none}}

.side{position:fixed;z-index:15;right:calc(clamp(16px,2.2vw,40px) + var(--sr));bottom:calc(clamp(16px,2.4vw,30px) + var(--sb));display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.side button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:1px 0;cursor:pointer;font-size:13px;color:#9a9578;transition:color .2s}
.side button::after{content:"";width:8px;height:8px;border-radius:50%;background:#fed9a6;transition:background .2s}
.side button:hover{color:#000}.side button:hover::after{background:var(--orange)}
.side button.cur{color:#000;font-weight:500}.side button.cur::after{background:var(--orange)}
.copy{position:fixed;z-index:15;left:calc(clamp(16px,2.4vw,44px) + var(--sl));bottom:calc(clamp(16px,2.4vw,30px) + var(--sb));font-size:13px;color:#8d8a6c}

/* ============ ADAPTIVE ============ */
/* portrait: brand on top, headline under it, character below the headline, nothing overlaps */
@media (max-aspect-ratio:1/1){
 :root{--hy:calc(var(--st) + 126px);--ht:calc(var(--st) + 240px);--bot:calc(var(--sb) + 60px)}
 .stage img{
  --H:max(calc((var(--vh) - var(--ht) - var(--bot))/.78),calc(100vw*704/1248));
  height:var(--H);width:calc(var(--H)*1248/704);aspect-ratio:auto;
  top:calc(var(--ht) - var(--H)*.19);transform:translateX(-50%) scale(1.05);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 95%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 95%,transparent 100%)}
 .hero{top:var(--hy);transform:none}
 .hero h1{font-size:clamp(34px,10vw,52px)}
 .hero p{font-size:clamp(15px,4.2vw,20px);line-height:1.35;max-width:min(88vw,520px);margin:8px auto 0}
 .copy{font-size:12px}
 .side{display:none}
}
/* tablets in portrait */
@media (min-width:600px) and (max-aspect-ratio:1/1){
 :root{--hy:calc(var(--st) + 140px);--ht:calc(var(--st) + 300px);--bot:calc(var(--sb) + 70px)}
 .brand{left:calc(28px + var(--sl));top:calc(24px + var(--st))}
 .brand a{font-size:30px;margin-bottom:12px}
 .brand span{font-size:16px}
 .hero h1{font-size:clamp(46px,7vw,64px)}
 .hero p{font-size:clamp(18px,2.6vw,22px)}
 .copy{font-size:13px;left:calc(28px + var(--sl));bottom:calc(24px + var(--sb))}
 .side{display:flex;right:calc(28px + var(--sr));bottom:calc(22px + var(--sb))}
}
/* landscape phones: headline moves to the left of the character, character fits the full height */
@media (max-height:520px) and (min-aspect-ratio:1/1){
 :root{--ht:calc(var(--st) + 14px);--bot:calc(var(--sb) + 14px)}
 .stage img{
  --H:max(calc((var(--vh) - var(--ht) - var(--bot))/.78),calc(100vw*.5371));
  height:var(--H);width:calc(var(--H)*1248/704);aspect-ratio:auto;
  top:clamp(calc(var(--vh) - var(--H)*1.025),calc(var(--ht) - var(--H)*.19),calc(var(--H)*-.025));
  transform:translateX(-50%) scale(1.05)}
 .brand{top:calc(10px + var(--st))}
 .brand a{font-size:19px;margin-bottom:6px}
 .brand span{font-size:12px;line-height:1.3}
 .hero{left:calc(var(--sl) + 16px);right:auto;top:50%;transform:translateY(-50%);text-align:left;padding:0;max-width:calc(50vw - 130px - var(--sl))}
 .hero h1{font-size:clamp(26px,9vh,40px);justify-content:flex-start}
 .hero p{font-size:clamp(13px,4vh,16px);margin-top:6px;line-height:1.35}
 .copy{font-size:12px;bottom:calc(10px + var(--sb))}
 .side{display:none}
}
@media (pointer:coarse){.side button{padding:6px 0}.brand a{padding:6px 0;margin:-6px 0 4px}}
/* touch has no hover: let the arrow gently nudge so it looks tappable */
@media (hover:none){.arrow svg{animation:nudge 2.6s ease-in-out 6.6s infinite}}
@keyframes nudge{0%,60%,100%{transform:none}75%{transform:translate(4px,-4px)}88%{transform:translate(-1px,1px)}}
@media (prefers-reduced-motion:reduce){.arrow svg{animation:none!important}}
</style><link rel="stylesheet" href="common.css"></head>
<body data-page="contact">
<div class="stage"><img src="contact.gif" alt="Designer character standing"></div>

<div class="brand"><a href="index.html" data-go>Kim Product Design</a><span data-i="b1">UX/UI Design</span><span data-i="b2">Service Design</span><span data-i="b3">Design Management</span></div>

<div class="hero"><h1 id="hd"></h1><p data-i="sub">Send me a DM or reply on Email, okay?</p></div>

<div class="side" aria-label="Sections"><button data-k="home" data-i="m_home">Home</button><button data-k="about" data-i="m_about">About</button><button data-k="c1" data-i="m_c1">Case 1</button><button data-k="c2" data-i="m_c2">Case 2</button><button data-k="c3" data-i="m_c3">Case 3</button><button data-k="c4" data-i="m_c4">Case 4</button><button class="cur" data-k="contact" data-i="m_contact">Contact</button></div>
<div class="copy">©kim product design</div>

<nav class="nav" id="nav" aria-label="Main menu">
 <button class="tog" id="tog" aria-expanded="false" aria-controls="list" aria-label="Open menu"><span class="dots"><span><i></i><i></i><i></i></span></span><span class="x"></span></button>
 <div class="list" id="list">
  <button data-k="home" data-i="m_home">Home</button>
  <button data-k="about" data-i="m_about">About</button>
  <div class="grp" data-i="m_case">Case</div>
  <button class="sub" data-k="c1" data-i="m_c1">Case 1</button><button class="sub" data-k="c2" data-i="m_c2">Case 2</button><button class="sub" data-k="c3" data-i="m_c3">Case 3</button><button class="sub" data-k="c4" data-i="m_c4">Case 4</button>
  <button data-k="contact" style="margin-top:8px" data-i="m_contact">Contact</button>
  <button class="lg-btn" id="lgBtn" aria-expanded="false" aria-controls="lgRow"><span class="lg-ico globe" id="lgIco"></span><span data-i="lang">Language</span></button>
  <div class="lg-row" id="lgRow"></div>
 </div>
</nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><div class="box"><button class="cl" id="cl" aria-label="Close">×</button><h2 id="sh"></h2><div id="sb"></div></div></div>

<div class="loader" id="loader" aria-hidden="true"><div class="bgfade"></div>
 <svg class="ring" viewBox="-30 -30 360 360"><defs><path id="c" d="M150,150 m-140,0 a140,140 0 1,1 280,0 a140,140 0 1,1 -280,0"/></defs>
 <text><textPath id="rt" href="#c" textLength="868" lengthAdjust="spacing">Welcome to my room. Click me! Welcome to my room. Click me!</textPath></text></svg><div class="inside"><small data-i="ld_s">Don’t be shy.<br>Feel free to say</small><b data-i="ld_b">“Hey!”</b></div></div>
<script>
/* heading: letters rise one by one, then the arrow pops in (rebuilt on every language change) */
window.buildHeading=function(fast){const h=document.getElementById('hd');h.innerHTML='';let i=0;
 const base=fast?'0s':'4.7s',ab=fast?'.45s':'5.45s';
 t('say').split(' ').forEach(word=>{const w=document.createElement('span');w.className='w';
  [...word].forEach(c=>{const s=document.createElement('span');s.className='ch';s.style.setProperty('--i',i++);s.style.setProperty('--base',base);s.textContent=c;w.appendChild(s)});h.appendChild(w)});
 const b=document.createElement('button');b.className='arrow';b.dataset.k='mail';b.setAttribute('aria-label',t('arrow'));b.style.setProperty('--abase',ab);
 b.innerHTML='<svg viewBox="0 0 40 40" fill="none" stroke="#fea831" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 30 30 10"/><path d="M13 10h17v17"/></svg>';h.appendChild(b)};
</script>
<script src="app.js"></script>
</body></html>
